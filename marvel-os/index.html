<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>Marvel OS</title><style>html,body{margin:0;background:#07090d;color:white;font-family:system-ui,-apple-system,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.dot{width:42px;height:42px;border:3px solid #27364a;border-top-color:#5fe4ff;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#8fa0b3}</style></head><body><div id="boot"><div><div class="dot"></div><b>Loading Marvel OS</b><br><small>Your transformation operating system</small></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/guyrubin/Security-/marvel-os-host/marvel-os/';const names=Array.from({length:9},(_,i)=>'chunk'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(names.map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));let app=parts.join('');app=app.replace('<link rel="manifest" href="./manifest.webmanifest">','').replace('if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}','');document.open();document.write(app);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>Marvel OS could not load</b><p><small>Check your connection and reload.</small></p></div>'}})();</script></body></html>
