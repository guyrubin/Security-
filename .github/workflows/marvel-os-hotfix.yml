name: Marvel OS hotfix

on:
  push:
    branches: [marvel-os-host]
    paths:
      - '.github/workflows/marvel-os-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marvel-os-host
      - name: Patch mobile renderer and iPhone safe area
        shell: python
        run: |
          from pathlib import Path

          p = Path('marvel-os/chunk06.txt')
          s = p.read_text(encoding='utf-8')
          old = '''function workoutState(date=localDateISO()){
           return JSON.parse(localStorage.getItem("mtosWorkout:"+date)||'{"done":{},"custom":[]}');
          }'''
          new = '''function workoutState(date=localDateISO()){
           let state;
           try{state=JSON.parse(localStorage.getItem("mtosWorkout:"+date)||'{"done":{},"custom":[]}')}catch(e){state={done:{},custom:[]}}
           if(!state||typeof state!=="object")state={done:{},custom:[]};
           if(!state.done||typeof state.done!=="object")state.done={};
           if(!Array.isArray(state.custom))state.custom=[];
           return state;
          }'''
          if old not in s:
              raise SystemExit('workoutState target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('marvel-os/chunk01.txt')
          s = p.read_text(encoding='utf-8')
          s = s.replace(' .todayCompactHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 6px}', ' .todayCompactHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 2px 8px}')
          s = s.replace(' .app{padding:10px 10px 24px}', ' .app{padding:0 10px 24px}')
          p.write_text(s, encoding='utf-8')
      - name: Commit hotfix
        run: |
          git config user.name "Marvel OS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marvel-os/chunk01.txt marvel-os/chunk06.txt
          git diff --cached --quiet && exit 0
          git commit -m "Fix Marvel OS mobile exercise renderer"
          git push origin marvel-os-host
